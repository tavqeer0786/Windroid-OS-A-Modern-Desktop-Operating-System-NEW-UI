name: Build Windroid OS Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'iso-builder/**'
      - 'linux/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-live-iso.yml'

concurrency:
  group: windroid-live-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build & Validate Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Runner Optimization)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Matching npm Version
        run: |
          node --version
          npm --version
          npm install --global npm@11.19.0
          npm --version

      - name: Install Debian live-build & Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debian-archive-keyring \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            curl \
            ca-certificates \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

          # Remove obsolete Ubuntu live-build package if present
          sudo apt-get remove -y live-build || true

          # Download and install official Debian Bookworm live-build package (1:20230502)
          curl -sSL -o /tmp/live-build_20230502_all.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          dpkg-deb --info /tmp/live-build_20230502_all.deb
          sudo apt-get install -y /tmp/live-build_20230502_all.deb
          rm -f /tmp/live-build_20230502_all.deb

          LIVE_BUILD_PACKAGE_VERSION="$(dpkg-query -W -f='${Version}' live-build)"
          if [ "$LIVE_BUILD_PACKAGE_VERSION" != "1:20230502" ]; then
            echo "ERROR: Expected Debian Bookworm live-build 1:20230502."
            echo "Installed: $LIVE_BUILD_PACKAGE_VERSION"
            exit 1
          fi

      - name: Print System Diagnostics & Tool Versions
        run: |
          echo "=== Host OS Info ==="
          cat /etc/os-release
          echo "=== Live-Build Package Version ==="
          dpkg-query -W -f='${Version}\n' live-build
          echo "=== Live-Build Executable Version ==="
          lb --version || true
          echo "=== Debootstrap Version ==="
          debootstrap --version
          echo "=== Xorriso Version ==="
          xorriso -version | head -n 5
          echo "=== Disk Space ==="
          df -h
          echo "=== Node & npm Versions ==="
          node --version
          npm --version

          LIVE_BUILD_PACKAGE_VERSION="$(dpkg-query -W -f='${Version}' live-build)"
          if [ "$LIVE_BUILD_PACKAGE_VERSION" != "1:20230502" ]; then
            echo "ERROR: Expected Debian Bookworm live-build 1:20230502."
            echo "Installed: $LIVE_BUILD_PACKAGE_VERSION"
            exit 1
          fi

      - name: Validate Target Live OS Configuration
        run: |
          echo "=== Target Live OS Validation ==="
          echo "Host OS          : Ubuntu GitHub Runner"
          echo "Target Live OS   : Debian 12 Bookworm amd64"
          echo "Bootstrap Mirror : https://deb.debian.org/debian"
          echo "Security Mirror  : https://security.debian.org/debian-security"
          test -f /usr/share/keyrings/debian-archive-keyring.gpg || {
            echo "ERROR: debian-archive-keyring.gpg is missing!"
            exit 1
          }

      - name: Verify Lockfile Synchronization (Preflight Check)
        run: |
          set -euo pipefail

          echo "=== CI Dependency Preflight Verification ==="
          test -f package-lock.json || {
            echo "ERROR: package-lock.json is missing from repository root!"
            exit 1
          }

          # Perform dry-run lockfile sync check to fail fast if package.json and package-lock.json drifted
          npm ci --dry-run --include=optional || {
            echo "CRITICAL ERROR: package.json and package-lock.json are out of sync!"
            echo "Developers: Run 'npm install' locally and commit both package.json and package-lock.json together."
            exit 1
          }

          echo "Preflight verification passed: package-lock.json is fully synchronized with package.json."

      - name: CI Dependency Verification & Web Build
        run: |
          set -euo pipefail

          node --version
          npm --version

          npm ci --include=optional

          test -d node_modules/@tailwindcss || {
            echo "@tailwindcss directory is missing from node_modules."
            exit 1
          }
          test -d node_modules/@tauri-apps || {
            echo "@tauri-apps directory is missing from node_modules."
            exit 1
          }
          test -d node_modules/esbuild || {
            echo "esbuild directory is missing from node_modules."
            exit 1
          }

          npm run build:web

      - name: Build Native Linux Tauri Desktop Shell (Optional)
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "Building native Tauri desktop shell binary..."
            cargo build --manifest-path src-tauri/Cargo.toml --release || true
          fi

      - name: Execute Live ISO Build Script
        run: |
          chmod +x iso-builder/build-live-iso.sh
          sudo ./iso-builder/build-live-iso.sh

      - name: Validate Generated Live ISO
        shell: bash
        run: |
          set -euo pipefail

          ISO_FILE="build/Windroid-Live-x86_64.iso"
          SUM_FILE="build/SHA256SUMS"
          MIN_SIZE_BYTES=314572800 # 300 MB minimum threshold

          echo "=== Windroid OS Live ISO Build Validation ==="

          if [ ! -f "$ISO_FILE" ]; then
            echo "ERROR: $ISO_FILE was not generated!"
            exit 1
          fi

          if [ ! -f "$SUM_FILE" ]; then
            echo "ERROR: $SUM_FILE was not generated!"
            exit 1
          fi

          ACTUAL_SIZE=$(stat -c%s "$ISO_FILE")
          echo "ISO File Path: $ISO_FILE"
          echo "Actual Size  : $ACTUAL_SIZE bytes ($(($ACTUAL_SIZE / 1024 / 1024)) MB)"
          echo "Min Required : $MIN_SIZE_BYTES bytes (300 MB)"

          if [ "$ACTUAL_SIZE" -le "$MIN_SIZE_BYTES" ]; then
            echo "ERROR: ISO size ($ACTUAL_SIZE bytes) is not greater than $MIN_SIZE_BYTES bytes (300 MB)!"
            exit 1
          fi

          echo "Verifying SHA256 checksum..."
          (cd build && sha256sum -c SHA256SUMS)

          echo "SUCCESS: Live ISO validation passed successfully!"
          echo "SHA256 Checksum: $(cat $SUM_FILE)"

      - name: Upload Live ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windroid-Live-x86_64
          path: |
            build/Windroid-Live-x86_64.iso
            build/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
