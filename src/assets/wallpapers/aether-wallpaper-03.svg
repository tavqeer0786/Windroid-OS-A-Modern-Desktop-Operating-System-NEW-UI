<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Navy Background -->
    <radialGradient id="bgNavy" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="60%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040817"/>
    </radialGradient>

    <!-- Fiery Amber Core Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="30%" stop-color="#FF6A00"/>
      <stop offset="65%" stop-color="#E83100"/>
      <stop offset="100%" stop-color="#14213D" stop-opacity="0"/>
    </radialGradient>

    <!-- Peach/Tan Outer Ribbon Gradient -->
    <linearGradient id="peachRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C4B3"/>
      <stop offset="40%" stop-color="#D99B84"/>
      <stop offset="80%" stop-color="#A66853"/>
      <stop offset="100%" stop-color="#593122"/>
    </linearGradient>

    <!-- Inner Shadow Peach Gradient -->
    <linearGradient id="peachShadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B87B66"/>
      <stop offset="50%" stop-color="#734232"/>
      <stop offset="100%" stop-color="#2D150B"/>
    </linearGradient>

    <!-- Luminous Fiery Rim -->
    <linearGradient id="fieryRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFAA00"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D99B84" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgNavy)"/>

  <!-- Core Radiant Amber Glow -->
  <circle cx="960" cy="540" r="500" fill="url(#amberGlow)"/>

  <!-- Centered 3D Peach Spiral Torus Group -->
  <g transform="translate(960, 540)">
    <!-- Outer Spiral Shell Base -->
    <path d="M -280,-100 C -420,120 -320,380 -80,420 C 180,460 420,320 440,50 C 460,-220 220,-420 -80,-400 C -340,-380 -480,-140 -400,120 C -340,320 -120,360 80,310 C 260,260 350,80 290,-100 C 230,-260 40,-300 -120,-240" 
          fill="none" stroke="url(#peachRibbon)" stroke-width="140" stroke-linecap="round"/>

    <!-- Inner Smooth Torus Form -->
    <path d="M -220,-80 C -340,90 -260,300 -60,330 C 140,360 330,250 350,40 C 370,-170 180,-330 -60,-310 C -260,-290 -360,-100 -300,100 C -250,250 -80,280 80,240 C 210,200 280,60 230,-80 C 180,-200 30,-230 -90,-180" 
          fill="none" stroke="url(#peachShadow)" stroke-width="80" stroke-linecap="round"/>

    <!-- Inner Core Fire Glow Overlay -->
    <ellipse cx="20" cy="50" rx="190" ry="230" fill="url(#amberGlow)" opacity="0.9"/>

    <!-- Fiery Rim Accent -->
    <path d="M -120,40 C -80,180 80,260 200,150 C 280,80 260,-80 180,-160 C 100,-240 -80,-200 -160,-80" 
          fill="none" stroke="url(#fieryRim)" stroke-width="26" stroke-linecap="round"/>

    <!-- Crisp Light Highlight -->
    <path d="M -250,-110 C -370,80 -280,330 -50,370 C 170,410 380,280 400,30" 
          fill="none" stroke="#FFEAE2" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
