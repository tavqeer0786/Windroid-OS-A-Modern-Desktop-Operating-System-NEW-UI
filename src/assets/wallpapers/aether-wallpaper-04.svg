<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Blue Radial Background -->
    <radialGradient id="bgBlueFluid" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2D4878"/>
      <stop offset="55%" stop-color="#1B2B4C"/>
      <stop offset="100%" stop-color="#0E172C"/>
    </radialGradient>

    <!-- Ribbon Violet Blue Gradient -->
    <linearGradient id="waveViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B82EE"/>
      <stop offset="40%" stop-color="#554CBF"/>
      <stop offset="80%" stop-color="#2B228C"/>
      <stop offset="100%" stop-color="#130C52"/>
    </linearGradient>

    <!-- Luminous Cyan Top Highlight -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2DCFF"/>
      <stop offset="50%" stop-color="#6DA3F7"/>
      <stop offset="100%" stop-color="#275FB3"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#5B7CFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1B2B4C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgBlueFluid)"/>

  <!-- Center Backing Soft Glow -->
  <circle cx="960" cy="540" r="550" fill="url(#centerGlow)"/>

  <!-- Organic 3D Twisted Sculpture Center -->
  <g transform="translate(960, 540)">
    <!-- Base Deep Violet Wave Fold -->
    <path d="M -180,280 C -280,180 -320,-40 -200,-180 C -80,-320 120,-380 220,-240 C 320,-100 240,140 100,280 C -40,420 -280,380 -340,180 C -400,-20 -240,-260 0,-340 C 240,-420 380,-180 320,80 C 260,340 0,420 -180,280 Z" 
          fill="url(#waveViolet)" stroke="#110B45" stroke-width="4"/>

    <!-- Layered Overlay Luminous Cyan Wave Curve -->
    <path d="M -120,200 C -220,100 -240,-80 -140,-200 C -40,-320 140,-280 200,-140 C 260,0 180,200 40,240 C -100,280 -200,120 -140,20 C -80,-80 80,-180 180,-120" 
          fill="none" stroke="url(#waveCyan)" stroke-width="64" stroke-linecap="round"/>

    <!-- Sharp Bright Specular Ridge -->
    <path d="M -150,-170 C -40,-290 120,-330 210,-210 C 300,-90 220,120 90,250" 
          fill="none" stroke="#E3EFFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
